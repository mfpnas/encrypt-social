<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 520"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Bicho-Pau — comunicação privada e criptografada</title>
  <desc id="desc">
    Logo de uma extensão de software livre para criptografar mensagens,
    representada por um bicho-pau dentro de um escudo aberto.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111B3A"/>
      <stop offset="100%" stop-color="#192856"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8"
                    flood-color="#071027" flood-opacity=".28"/>
    </filter>

    <style>
      .ink { stroke:#F4D06F; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .green { stroke:#70C1A1; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .thin { stroke-width:7; }
      .text-main { font-family:Inter,Arial,sans-serif; font-size:62px; font-weight:800; letter-spacing:2px; fill:#111B3A; }
      .text-sub { font-family:Inter,Arial,sans-serif; font-size:25px; font-weight:500; letter-spacing:3px; fill:#315A67; }
      .small { font-family:Inter,Arial,sans-serif; font-size:17px; font-weight:700; letter-spacing:2px; fill:#F4D06F; }
    </style>
  </defs>

  <!-- Fundo principal -->
  <rect width="1200" height="520" rx="36" fill="#F5F2E8"/>

  <!-- Símbolo / mascote -->
  <g transform="translate(65 48)" filter="url(#shadow)">

    <!-- escudo aberto -->
    <path d="M184 18
             C132 48 83 58 38 62
             L46 188
             C50 267 104 322 184 358"
          class="green"/>

    <path d="M184 18
             C236 48 285 58 330 62
             L322 188
             C318 267 264 322 184 358"
          class="green"/>

    <!-- folhas da Mata Atlântica -->
    <path d="M43 97 C12 72 6 39 19 14
             C51 22 67 47 67 77
             C66 89 57 96 43 97Z"
          fill="#70C1A1"/>

    <path d="M326 97 C357 72 363 39 350 14
             C318 22 302 47 302 77
             C303 89 312 96 326 97Z"
          fill="#70C1A1"/>

    <!-- envelope -->
    <rect x="91" y="163" width="186" height="124" rx="18"
          fill="#FFFDF5" stroke="#F4D06F" stroke-width="10"/>

    <path d="M96 177 L184 245 L272 177"
          class="ink thin"/>

    <path d="M98 280 L157 226 M270 280 L211 226"
          class="ink thin"/>

    <!-- cadeado aberto -->
    <path d="M151 152
             V124
             C151 91 203 91 203 124
             V143"
          class="ink thin"/>

    <rect x="143" y="137" width="82" height="71" rx="15"
          fill="#F4D06F"/>

    <circle cx="184" cy="169" r="9" fill="#111B3A"/>
    <path d="M184 178 V193" stroke="#111B3A" stroke-width="8"
          stroke-linecap="round"/>

    <!-- corpo do bicho-pau -->
    <path d="M130 327 C153 291 166 252 177 218"
          stroke="#315A67" stroke-width="13" stroke-linecap="round"/>

    <path d="M177 218 C190 181 206 147 224 111"
          stroke="#315A67" stroke-width="13" stroke-linecap="round"/>

    <!-- cabeça -->
    <ellipse cx="229" cy="99" rx="25" ry="20" fill="#315A67"/>
    <circle cx="237" cy="94" r="4" fill="#F5F2E8"/>

    <!-- antenas -->
    <path d="M216 86 C196 65 184 59 169 58
             M237 83 C252 62 267 55 282 53"
          stroke="#315A67" stroke-width="7" fill="none"
          stroke-linecap="round"/>

    <!-- pernas -->
    <path d="M165 247 L103 226 M165 247 L112 277
             M191 190 L248 158 M191 190 L255 211
             M148 293 L84 294 M148 293 L106 330"
          stroke="#315A67" stroke-width="9" fill="none"
          stroke-linecap="round"/>

    <!-- nós da rede -->
    <circle cx="70" cy="350" r="13" fill="#F4D06F"/>
    <circle cx="184" cy="382" r="13" fill="#F4D06F"/>
    <circle cx="298" cy="350" r="13" fill="#F4D06F"/>

    <path d="M82 353 L172 378 M196 378 L286 353"
          stroke="#F4D06F" stroke-width="7" fill="none"
          stroke-linecap="round"/>
  </g>

  <!-- Nome -->
  <g transform="translate(510 165)">
    <text class="text-main" x="0" y="0">BICHO-PAU</text>
    <text class="text-sub" x="4" y="52">MENSAGENS LIVRES E PRIVADAS</text>

    <!-- linha criptográfica -->
    <path d="M5 92 H430" stroke="#70C1A1" stroke-width="7"
          stroke-linecap="round"/>

    <circle cx="20" cy="92" r="9" fill="#F4D06F"/>
    <circle cx="145" cy="92" r="9" fill="#F4D06F"/>
    <circle cx="270" cy="92" r="9" fill="#F4D06F"/>
    <circle cx="415" cy="92" r="9" fill="#F4D06F"/>

    <text class="small" x="4" y="145">CRIPTOGRAFIA • PRIVACIDADE • SOFTWARE LIVRE</text>
  </g>

  <!-- Ícone separado -->
  <g transform="translate(930 315)">
    <rect width="190" height="160" rx="34" fill="url(#bg)"
          filter="url(#shadow)"/>

    <!-- mini escudo aberto -->
    <path d="M95 30 C67 48 43 52 25 54 L30 99
             C33 124 55 143 95 151"
          stroke="#70C1A1" stroke-width="7" fill="none"
          stroke-linecap="round"/>

    <path d="M95 30 C123 48 147 52 165 54 L160 99
             C157 124 135 143 95 151"
          stroke="#70C1A1" stroke-width="7" fill="none"
          stroke-linecap="round"/>

    <!-- bicho-pau estilizado -->
    <path d="M72 124 C86 94 94 72 111 43"
          stroke="#F4D06F" stroke-width="9"
          stroke-linecap="round" fill="none"/>

    <ellipse cx="116" cy="39" rx="13" ry="11" fill="#F4D06F"/>
    <circle cx="120" cy="36" r="2.5" fill="#111B3A"/>

    <path d="M103 48 L76 65 M98 67 L69 83
             M88 91 L61 103 M108 57 L137 70
             M99 82 L132 98"
          stroke="#F4D06F" stroke-width="6"
          stroke-linecap="round"/>

    <!-- ponto de mensagem -->
    <circle cx="95" cy="112" r="13" fill="#70C1A1"/>
    <path d="M89 112 L94 117 L103 106"
          stroke="#111B3A" stroke-width="5"
          fill="none" stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
