<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Encrypt Social</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px; padding: 16px;
      font-family: system-ui, sans-serif;
      background: #1a1a2e; color: #e0e0e0;
    }
    h1 { font-size: 16px; margin-bottom: 12px; color: #4ecca3; }
    .status {
      background: #16213e; border-radius: 8px; padding: 10px;
      font-size: 12px; margin-bottom: 12px; line-height: 1.4;
    }
    .status.ok { border-left: 3px solid #4ecca3; }
    .status.warn { border-left: 3px solid #ffa500; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #0f3460; color: #fff; font-size: 13px; cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { background: #1a4a7a; }
    button.secondary {
      background: transparent; border: 1px solid #0f3460; color: #e0e0e0;
    }
    .key-info {
      font-size: 11px; color: #888; word-break: break-all;
      background: #16213e; padding: 8px; border-radius: 6px; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>🔐 Encrypt Social</h1>
  <div id="status" class="status warn">Loading…</div>
  <div id="key-info" class="key-info" style="display:none;"></div>
  <button id="btn-generate">Generate new key pair</button>
  <button id="btn-options" class="secondary">Open settings</button>
  <script src="crypto.js"></script>
  <script src="popup.js"></script>
</body>
</html>
