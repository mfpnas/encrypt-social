<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Encrypt Social — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: #1a1a2e;
      color: #e0e0e0; padding: 32px; max-width: 720px; margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 24px; color: #4ecca3; }
    h2 { font-size: 16px; margin: 24px 0 12px; color: #a0a0c0; }
    .card {
      background: #16213e; border-radius: 12px; padding: 20px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px; border: none; border-radius: 8px;
      background: #0f3460; color: #fff; font-size: 13px; cursor: pointer;
      margin-right: 8px; margin-top: 8px;
    }
    button:hover { background: #1a4a7a; }
    button.danger { background: #7a1a2e; }
    button.danger:hover { background: #9a2a3e; }
    button.secondary { background: transparent; border: 1px solid #0f3460; }
    .key-display {
      font-size: 11px; color: #888; word-break: break-all;
      background: #0d1b2a; padding: 10px; border-radius: 6px;
      margin-top: 8px; font-family: monospace;
    }
    textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #0f3460;
      background: #0d1b2a; color: #e0e0e0; font-family: monospace;
      font-size: 12px; resize: vertical; min-height: 80px;
    }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #a0a0c0; }
    .contacts-list { margin-top: 12px; }
    .contact-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #0f3460; font-size: 12px;
      gap: 8px;
    }
    .contact-item:last-child { border-bottom: none; }
    input[type="text"], input[type="email"] {
      width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #0f3460;
      background: #0d1b2a; color: #e0e0e0; font-size: 13px; margin-bottom: 8px;
    }
    .small { font-size: 12px; color: #888; }
    .fingerprint {
      font-family: monospace; font-size: 11px; color: #79c0ff;
      background: #0d1b2a; padding: 8px; border-radius: 6px;
      margin-top: 8px; word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>🔐 Encrypt Social — Settings</h1>

  <div class="card">
    <h2>Identity</h2>
    <label for="identity">Your registered email (used as contact ID)</label>
    <input type="email" id="identity" placeholder="e.g. aurionps@gmail.com" />
    <button id="btn-save-identity">Save identity</button>
  </div>

  <div class="card">
    <h2>Your key pair</h2>
    <div id="key-status">Loading…</div>
    <div id="public-key-display" class="key-display" style="display:none;"></div>
    <div id="fingerprint-display" class="fingerprint" style="display:none;"></div>
    <button id="btn-generate">Generate new key pair</button>
    <button id="btn-export" class="secondary">Export public key</button>
    <button id="btn-export-backup" class="secondary">Export backup (JSON)</button>
  </div>

  <div class="card">
    <h2>Trusted contacts</h2>
    <p class="small" style="margin-bottom:12px;">
      Add the public keys of people you want to exchange encrypted messages with.
    </p>
    <label for="contact-id">Contact email / ID</label>
    <input type="email" id="contact-id" placeholder="e.g. cidamelfaria@gmail.com" />
    <label for="contact-key">Public key (base64)</label>
    <textarea id="contact-key" placeholder="Paste the public key here…"></textarea>
    <button id="btn-add-contact">Add contact</button>
    <div id="contacts-list" class="contacts-list"></div>
  </div>

  <div class="card">
    <h2>Danger zone</h2>
    <p class="small" style="margin-bottom:12px;">
      Clearing permanently deletes the key pair and all contacts.
    </p>
    <button id="btn-clear" class="danger">Clear everything</button>
  </div>

  <script src="crypto.js"></script>
  <script src="options.js"></script>
</body>
</html>
